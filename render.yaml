services:
  - type: web
    name: listner
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m listner.supervisor
    autoDeploy: true
    envVars:
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_CHAT_ID
        sync: false
      - key: CONTROL_SECRET
        sync: false
      - key: POLL_SECONDS
        value: "2"
      - key: LEASE_SECONDS
        value: "10"
